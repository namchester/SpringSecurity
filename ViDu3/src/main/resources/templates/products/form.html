<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container narrow">
    <section class="panel">
        <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>

        <form th:object="${productDTO}"
              th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}"
              method="post"
              enctype="multipart/form-data"
              accept-charset="UTF-8">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <div class="form-grid">
                <label>Tên sản phẩm</label>
                <div>
                    <input type="text" th:field="*{name}">
                    <small class="field-error" th:errors="*{name}"></small>
                </div>

                <label>Mô tả</label>
                <textarea th:field="*{description}" rows="5"></textarea>

                <label>Giá</label>
                <div>
                    <input type="number" min="0" step="0.01" th:field="*{price}">
                    <small class="field-error" th:errors="*{price}"></small>
                </div>

                <label>Ảnh</label>
                <input type="file" name="image" accept="image/*">

                <div th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}">
                    <img th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}"
                         class="preview"
                         alt="Ảnh hiện tại">
                </div>

                <div>
                    <button class="btn primary" type="submit">Lưu</button>
                    <a class="btn secondary" th:href="@{/products}">Hủy</a>
                </div>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
