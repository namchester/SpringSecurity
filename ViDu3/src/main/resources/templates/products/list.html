<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Products')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <div class="page-title">
        <h1>Quản lý Products</h1>
        <a class="btn primary" th:href="@{/products/create}">+ Thêm Product</a>
    </div>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <form class="search" th:action="@{/products}" method="get">
        <input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả...">
        <input type="hidden" name="size" th:value="${size}">
        <button class="btn secondary" type="submit">Tìm kiếm</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>Name</th>
                <th>Price</th>
                <th>User</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products.content}">
                <td th:text="${p.id}"></td>
                <td>
                    <img th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                         th:src="${#strings.substringBefore(p.imageUrl, '|')}"
                         class="thumb"
                         alt="Product">
                    <span th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}">No image</span>
                </td>
                <td th:text="${p.name}"></td>
                <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${p.username}"></td>
                <td class="actions">
                    <a class="btn small secondary" th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}"
                          method="post"
                          onsubmit="return confirm('Xóa product này?')">
                        <button class="btn small danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${products.empty}">
                <td colspan="6">Không có dữ liệu.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${products.totalPages > 1}">
        <a th:if="${products.hasPrevious()}"
           th:href="@{/products(page=${products.number-1},size=${size},keyword=${keyword})}">«</a>
        <a th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
           th:href="@{/products(page=${i},size=${size},keyword=${keyword})}"
           th:text="${i+1}"
           th:classappend="${i == products.number} ? 'active' : ''"></a>
        <a th:if="${products.hasNext()}"
           th:href="@{/products(page=${products.number+1},size=${size},keyword=${keyword})}">»</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
