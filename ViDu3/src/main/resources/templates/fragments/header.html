<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <a class="brand" th:href="@{/}">IOTSTAR SHOP</a>

    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/products}">Products</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}">Users</a>
    </nav>

    <div class="spacer"></div>

    <div sec:authorize="isAuthenticated()" class="account">
        <span>Xin chào <strong sec:authentication="name">user</strong></span>
        <form th:action="@{/logout}" method="post">
            <button class="link-button" type="submit">Logout</button>
        </form>
    </div>

    <div sec:authorize="!isAuthenticated()" class="account">
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Register</a>
    </div>
</header>
</body>
</html>
