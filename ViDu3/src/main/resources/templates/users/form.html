<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm User' : 'Sửa User'})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container narrow">
    <section class="panel">
        <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}"></h1>

        <form th:object="${userDTO}"
              th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <div class="form-grid">
                <label>Username</label>
                <div>
                    <input th:field="*{username}">
                    <small class="field-error" th:errors="*{username}"></small>
                </div>

                <label>Email</label>
                <div>
                    <input type="email" th:field="*{email}">
                    <small class="field-error" th:errors="*{email}"></small>
                </div>

                <label>Họ tên</label>
                <div>
                    <input th:field="*{fullName}">
                    <small class="field-error" th:errors="*{fullName}"></small>
                </div>

                <label>Role</label>
                <select th:field="*{roleName}">
                    <option value="ROLE_USER">USER</option>
                    <option value="ROLE_ADMIN">ADMIN</option>
                </select>

                <label>Enabled</label>
                <input type="checkbox" th:field="*{enabled}">

                <div>
                    <button class="btn primary" type="submit">Lưu</button>
                    <a class="btn secondary" th:href="@{/users}">Hủy</a>
                </div>
            </div>
        </form>

        <p th:if="${mode == 'create'}" class="note">
            Mật khẩu mặc định của user do Admin tạo: <strong>123456</strong>.
        </p>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
