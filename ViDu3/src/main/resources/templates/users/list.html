<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Users')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <div class="page-title">
        <h1>Quản lý Users</h1>
        <a class="btn primary" th:href="@{/users/create}">+ Thêm User</a>
    </div>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <form class="search" th:action="@{/users}" method="get">
        <input name="keyword" th:value="${keyword}" placeholder="Username, email, họ tên...">
        <input type="hidden" name="size" th:value="${size}">
        <button class="btn secondary" type="submit">Tìm kiếm</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Họ tên</th>
                <th>Role</th>
                <th>Enabled</th>
                <th>Products</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users.content}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.roleName}"></td>
                <td th:text="${u.enabled ? 'ACTIVE' : 'INACTIVE'}"></td>
                <td th:text="${u.productCount}"></td>
                <td class="actions">
                    <a class="btn small secondary" th:href="@{/users/edit/{id}(id=${u.id})}">Edit</a>
                    <form th:action="@{/users/delete/{id}(id=${u.id})}"
                          method="post"
                          onsubmit="return confirm('Xóa user này?')">
                        <button class="btn small danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="8">Không có dữ liệu.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${users.totalPages > 1}">
        <a th:if="${users.hasPrevious()}"
           th:href="@{/users(page=${users.number-1},size=${size},keyword=${keyword})}">«</a>
        <a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
           th:href="@{/users(page=${i},size=${size},keyword=${keyword})}"
           th:text="${i+1}"
           th:classappend="${i == users.number} ? 'active' : ''"></a>
        <a th:if="${users.hasNext()}"
           th:href="@{/users(page=${users.number+1},size=${size},keyword=${keyword})}">»</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
