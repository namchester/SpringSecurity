<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>Xác nhận OTP</h1>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Email</label>
        <input type="email" th:field="*{email}" readonly required>
        <small class="field-error" th:errors="*{email}"></small>

        <label>OTP 6 số</label>
        <input th:field="*{otp}" maxlength="6" inputmode="numeric" required>
        <small class="field-error" th:errors="*{otp}"></small>

        <button class="btn primary full" type="submit">Xác nhận</button>
    </form>

    <form th:action="@{/resend-register-otp}" method="post" class="mt">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button class="btn secondary full" type="submit">Gửi lại OTP</button>
    </form>

    <p class="hint">Chế độ test: MAIL_ENABLED=false sẽ in OTP trong console.</p>
    <p><a th:href="@{/login}">Quay lại Login</a></p>
</div>
</body>
</html>
