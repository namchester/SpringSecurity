<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>Đặt lại mật khẩu</h1>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Email</label>
        <input type="email" th:field="*{email}" readonly required>
        <small class="field-error" th:errors="*{email}"></small>

        <label>OTP</label>
        <input name="otp" maxlength="6" inputmode="numeric" required>

        <label>Mật khẩu mới</label>
        <input type="password" th:field="*{password}" required>
        <small class="field-error" th:errors="*{password}"></small>

        <label>Xác nhận mật khẩu</label>
        <input type="password" th:field="*{confirmPassword}" required>
        <small class="field-error" th:errors="*{confirmPassword}"></small>

        <button class="btn primary full" type="submit">Đổi mật khẩu</button>
    </form>
</div>
</body>
</html>
