<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand"><a th:href="@{/}">IOTSTAR SHOP</a></div>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard}">Dashboard</a>
    </nav>
    <div class="account" sec:authorize="isAuthenticated()">
        <span>Đăng nhập: <b sec:authentication="name">user@email.com</b></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>
    <div sec:authorize="!isAuthenticated()"><a class="top-link" th:href="@{/login}">Đăng nhập</a></div>
</header>
</body>
</html>
